endpoints:
  - name: docker-gpu1 .1
    group: dns .1
    url: 192.168.1.50
    dns:
      query-name: docker-gpu1.bob.house
      query-type: CNAME
    conditions: &conditions-definition
      - "[BODY] == gpu1.bob.house."
      - "[DNS_RCODE] == NOERROR"
    alerts: &alerts-definition
      - type: ntfy

  - name: glances-gpu1 .1
    group: dns .1
    url: 192.168.1.50
    dns:
      query-name: glances-gpu1.bob.house
      query-type: CNAME
    conditions: *conditions-definition
    alerts: *alerts-definition

