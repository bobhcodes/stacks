        description: Send push notifications to your phone or desktop via PUT/POST
        href: https://ntfy.bob.house/{{HOMEPAGE_VAR_NTFY_TOPIC}}
        icon: ntfy.svg
        server: docker2
        container: ntfy
        widgets:
          - type: prometheusmetric
            url: https://prometheus.bob.house
            refreshInterval: 10000 # optional - in milliseconds, defaults to 10s
            metrics:
              - label: messages
                query: ntfy_messages_published_success
              - label: memory usage
                format:
                  type: bytes
                  options:
                    maximumFractionDigits: 2
                query: docker_container_mem_usage{com_docker_compose_project="docker2",com_docker_compose_service="ntfy"}
              - label: uptime
                format:
                  type: duration
                  scale: .000000001
                query: docker_container_status_uptime_ns{com_docker_compose_project="docker2",com_docker_compose_service="ntfy"}
          - type: ntfy
            fields: [ "title", "message", "lastReceived", ]
            url: https://ntfy.bob.house
            topic: {{HOMEPAGE_VAR_NTFY_TOPIC}}
