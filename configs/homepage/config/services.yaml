    - Glances BILLUPS: &glancesbillups
        href: https://glances-billups.bob.house/
        icon: glances.png
        server: billups-docker
        container: glances
        widgets:
          - type: prometheusmetric
            url: https://prometheus.bob.house
            refreshInterval: 10000 # optional - in milliseconds, defaults to 10s
            metrics:
              - label: uptime
                format:
                  type: duration
                query: system_uptime{host='billups'}
              - label: user cpu
                format:
                  type: percent
                  options:
                    maximumFractionDigits: 1
                  scale: 100
                query: rate(cpu_usage_user{host='billups'}[5m])
              - label: system cpu
                format:
                  type: percent
                  options:
                    maximumFractionDigits: 1
                  scale: 100
                query: rate(cpu_usage_system{host='billups'}[5m])
          - type: prometheusmetric
            url: https://prometheus.bob.house
            refreshInterval: 10000 # optional - in milliseconds, defaults to 10s
            metrics:
              - label: free disk
                format:
                  type: bytes
                  options:
                    maximumFractionDigits: 1
                query: disk_free{host='billups',path='/'}
              - label: disk used
                format:
                  type: percent
                  options:
                    maximumFractionDigits: 1
                query: disk_used_percent{host='billups',path='/'}
          - type: prometheusmetric
            url: https://prometheus.bob.house
            refreshInterval: 10000 # optional - in milliseconds, defaults to 10s
            metrics:
              - label: running containers
                query: docker_n_containers_running{host='billups'}
              - label: paused containers
                query: docker_n_containers_paused{host='billups'}
              - label: stopped containers
                query: docker_n_containers_stopped{host='billups'}
