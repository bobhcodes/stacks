    - Home Assistant: &homeassistant
        description: Open-source home automation platform
        href: https://homeassistant.bob.house/
        icon: home-assistant.svg
        siteMonitor: https://homeassistant.bob.house
        widgets:
          - type: homeassistant
            url: https://homeassistant.bob.house
            key: {{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}
            custom:
              - label: living room
                template: "{{ states('sensor.apollo_mtr_1_7b75d4_dps310_temperature', rounded=True, with_unit=True) }}"
              - label: office
                template: "{{ states('sensor.apollo_air_1_06ef38_sen55_temperature', rounded=True, with_unit=True) }}"
              - label: desk
                template: "{{ states('sensor.apollo_msr_2_120ba4_dps310_temperature', rounded=True, with_unit=True) }}"
          - type: homeassistant
            url: https://homeassistant.bob.house
            key: {{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}
            custom:
              - label: pc
                state: sensor.p304m_desk_pc_current_consumption
              - label: monitors
                state: sensor.p304m_desk_monitors_current_consumption
              - label: speakers
                state: sensor.p304m_desk_speakers_current_consumption
              - label: usb hub
                state: sensor.p304m_desk_usb_hub_current_consumption
          - type: homeassistant
            url: https://homeassistant.bob.house
            key: {{HOMEPAGE_VAR_HOMEASSISTANT_KEY}}
            custom:
              - label: bench
                state: sensor.p304m_server_rack_bench_current_consumption
              - label: switches
                state: sensor.p304m_server_rack_pdu_top_current_consumption
              - label: servers
                state: sensor.p304m_server_rack_pdu_bottom_current_consumption
