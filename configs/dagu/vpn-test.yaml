schedule: CRON_TZ=Etc/UTC 0 * * * *
retry_policy:
  limit: 0
steps:
  - id: get_ip
    action: http.request
    with:
      method: GET
      url: https://api.ipapi.is
      headers:
        Accept: application/json; charset=utf-8
        User-Agent: Mozilla/5.0 (iPad; U; CPU OS 3_2_1 like Mac OS X; en-us) AppleWebKit/531.21.10 (KHTML, like Gecko) Mobile/7B405
      format: "json"
      silent: false
    output:
      status_code:
        from: stdout
        decode: json
        select: .status_code
      ip:
        from: stdout
        decode: json
        select: .body.ip
  - id: test_containers
    action: dag.run
    parallel:
      items:
        - host: freeman.bob.house
          container: gluetun
        - host: docker2.bob.house
          container: gluetun
        - host: tana.bob.house
          container: gluetun
    with:
      dag: server-processor
      params:
        HOST: ${ITEM.host}
        CONTAINER: ${ITEM.container}
    depends: get_ip
    preconditions:
      - condition: "${get_ip.output.status_code}"
        expected: "200"
      - condition: "${get_ip.output.ip}"
        expected: "re:.+"
    output:
      summary:
        from: stdout
        decode: json
        select: "[.results[].outputValues.ip]"
  - id: test
    run: |
      home_ip="${get_ip.output.ip}"
      gluetun_ip0="${test_containers.output.summary[0]}"
      gluetun_ip1="${test_containers.output.summary[1]}"
      gluetun_ip2="${test_containers.output.summary[2]}"
      if [ "${gluetun_ip0}" == "${home_ip}" || "${gluetun_ip1}" == "${home_ip}" || "${gluetun_ip2}" == "${home_ip}" ]; then
        echo "true"
      else
        echo "false"
      fi
    output:
      work_to_do:
        from: stdout
        decode: text
    depends: [get_ip,test_containers]
  - id: notify
    action: http.request
    with:
      method: POST
      url: https://ntfy.bob.house/364d0bdedc5b0bc275b048dc42e342460fb535dc1efcc5daf35460bf4ba4c26e
      headers:
        Content-Type: text/plain
        User-Agent: Mozilla/5.0 (iPad; U; CPU OS 3_2_1 like Mac OS X; en-us) AppleWebKit/531.21.10 (KHTML, like Gecko) Mobile/7B405
        Priority: urgent
        Tags: earth_africa
        Title: "${CONTAINER} vpn failed"
      format: "json"
      silent: false
    retry_policy:
      limit: 3
      interval_sec: 5
    depends: test
    preconditions:
      - condition: "${test.output.work_to_do}"
        expected: "true"
---
name: server-processor
retry_policy:
  limit: 0
params:
  - HOST: ""
  - CONTAINER: ""
steps:
  - id: get_ip
    action: ssh.run
    with:
      user: root
      host: "${HOST}"
      key: /run/secrets/id_rsa
      known_host_file: /run/secrets/known_hosts
      command: |
        docker exec "${CONTAINER}" \
          wget --output-document - --quiet https://api.ipapi.is
    output:
      ip:
        from: stdout
        decode: json
        select: .ip
  - id: publish_result
    action: outputs.write
    with:
      values:
        host: "${HOST}"
        ip: "${get_ip.output.ip}"
    depends: get_ip
