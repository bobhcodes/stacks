services:
  leafwiki:
    image: ghcr.io/perber/leafwiki:${LEAFWIKI_IMAGE_TAG?:missing leafwiki image tag}
    cap_drop: [ ALL, ]
    container_name: leafwiki
    depends_on:
      traefik:
        condition: service_healthy
    env_file:
      - ${REPOS_DIR:-/opt/repos}/Configurations/leafwiki.env
    environment:
      LEAFWIKI_ALLOW_INSECURE: "true"
      LEAFWIKI_CUSTOM_STYLESHEET: custom.css
      LEAFWIKI_PUBLIC_ACCESS: "true"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider http://localhost:8080/api/config || exit 1", ]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      dd.link.template: https://github.com/perber/leafwiki/releases/tag/v$${major}.$${minor}.$${patch}
      dd.tag.family: loose
      dd.tag.include: ^v\d+\.\d+\.\d+$$
      dd.watch: "true"

      traefik.http.routers.leafwiki-lan-router.entrypoints: lan
      traefik.http.routers.leafwiki-lan-router.rule: Host(`www.bob.house`)
      traefik.http.routers.leafwiki-lan-router.service: leafwiki-lan-service
      traefik.http.routers.leafwiki-lan-router.tls: "true"
      traefik.http.services.leafwiki-lan-service.loadbalancer.server.port: "8080"

      traefik.http.routers.leafwiki-wan-router.entrypoints: wan
      traefik.http.routers.leafwiki-wan-router.middlewares: method-whitelist-middleware@file,secure-headers-middleware@file,block-path-middleware@file,security-txt-middleware@file
      traefik.http.routers.leafwiki-wan-router.rule: Host(`www.bob.house`)
      traefik.http.routers.leafwiki-wan-router.service: leafwiki-wan-service
      traefik.http.routers.leafwiki-wan-router.tls: "true"
      traefik.http.services.leafwiki-wan-service.loadbalancer.server.port: "8080"
    networks:
      traefik: null
    profiles: [ wan1, ]
    read_only: true
    security_opt: [ no-new-privileges=true, ]
    tmpfs: [ "/tmp/:noexec,nosuid,uid=1000,gid=1000", ]
    user: 1000:1000
    volumes:
      - ${DATA_DIR:-/opt/appdata}/leafwiki/:/app/data/:rw
      - ./configs/leafwiki.css:/app/data/custom.css:ro

  miasma:
    image: austinweeks/miasma:${MIASMA_IMAGE_TAG?:missing miasma image tag}
    cap_drop: [ ALL, ]
    command: [ "--host", "0.0.0.0", "--port", "9999", "--link-count", "5", "--max-depth", "8", "--max-in-flight", "50", ]
    container_name: miasma
    depends_on:
      traefik:
        condition: service_healthy
    labels:
      dd.link.template: https://github.com/austin-weeks/miasma/releases/tag/v$${major}.$${minor}.$${patch}
      dd.tag.family: loose
      dd.tag.include: ^\d+\.\d+\.\d+$$
      dd.watch: "true"
      traefik.docker.network: traefik-network

      traefik.http.routers.miasma-lan-router.entrypoints: lan
      traefik.http.routers.miasma-lan-router.rule: Host(`miasma.bob.house`)
      traefik.http.routers.miasma-lan-router.service: miasma-lan-service
      traefik.http.routers.miasma-lan-router.tls: "true"
      traefik.http.services.miasma-lan-service.loadbalancer.server.port: "9999"

      traefik.http.routers.miasma-wan-router.entrypoints: wan
      traefik.http.routers.miasma-wan-router.middlewares: method-whitelist-middleware@file,secure-headers-middleware@file,security-txt-middleware@file
      traefik.http.routers.miasma-wan-router.rule: Host(`miasma.bob.house`)
      traefik.http.routers.miasma-wan-router.service: miasma-wan-service
      traefik.http.routers.miasma-wan-router.tls: "true"
      traefik.http.services.miasma-wan-service.loadbalancer.server.port: "9999"
    networks:
      default: null
      traefik: null
    profiles: [ wan1, ]
    read_only: true
    security_opt: [ no-new-privileges=true, ]

  opencanary:
    image: thinkst/opencanary:${OPENCANARY_IMAGE_TAG?:missing opencanary image tag}
    cap_drop: [ ALL, ]
    cap_add: [ SETGID, SETUID, ]
    container_name: opencanary
    deploy:
      resources:
        limits:
          cpus: 1
          memory: 128M
          pids: 4
        reservations:
          cpus: 1
          memory: 128M
    dns: [ 192.168.1.65, ]
    labels:
      dd.link.template: https://github.com/thinkst/opencanary/releases/tag/v$${major}.$${minor}.$${patch}
      dd.tag.family: loose
      dd.tag.include: ^\d+\.\d+\.\d+$$
      dd.watch: "true"
      traefik.enable: "false"
    networks:
      default: null
    ports:
      - 192.168.1.85:44421:21/tcp # FTP
      - 192.168.1.85:44422:22/tcp # SSH
      - 192.168.1.85:44423:23/tcp # Telnet
      - 192.168.1.85:44469:69/tcp # TFTP
      - 192.168.1.85:44480:80/tcp # HTTP
      - 192.168.1.85:44123:123/tcp # NTP
      - 192.168.1.85:44161:161/tcp # SNMP
      - 192.168.1.85:41433:1433/tcp # MSSQL
      - 192.168.1.85:43306:3306/tcp # MYSQL
      - 192.168.1.85:43389:3389/tcp # RDP
      - 192.168.1.85:45000:5000/tcp # VNC
      - 192.168.1.85:45060:5060/tcp # SIP
      - 192.168.1.85:46379:6379/tcp # REDIS
      - 192.168.1.85:48001:8001/tcp # TCP Banner
      - 192.168.1.85:48080:8080/tcp # HTTP Proxy
      - 192.168.1.85:49418:9418/tcp # Git
    profiles: [ wan1, ]
    read_only: true
    security_opt: [ no-new-privileges=true, ]
    tmpfs:
      - /var/run/:noexec,nosuid,uid=0,gid=0,size=64M
      - /var/tmp/:noexec,nosuid,uid=65534,gid=65534,size=64M
    user: 0:0
    volumes: [ ./configs/opencanary.conf:/etc/opencanaryd/opencanary.conf:ro, ]

  webhooks:
    build:
      dockerfile_inline: |
        FROM alpine:${ALPINE_IMAGE_TAG:?missing alpine image tag}
        RUN apk add --no-cache --update curl webhook
        ENTRYPOINT [ "webhook", "-hooks", "/app/webhooks.json", "-template", "-verbose" ]
    cap_drop: [ ALL, ]
    container_name: webhooks
    depends_on:
      traefik:
        condition: service_healthy
    env_file:
      - ${REPOS_DIR:-/opt/repos}/Configurations/webhooks.env
    labels:
      traefik.docker.network: traefik-network

      traefik.http.routers.webhooks-lan-router.entrypoints: lan
      traefik.http.routers.webhooks-lan-router.rule: Host(`webhooks.bob.house`)
      traefik.http.routers.webhooks-lan-router.service: webhooks-lan-service
      traefik.http.routers.webhooks-lan-router.tls: "true"
      traefik.http.services.webhooks-lan-service.loadbalancer.server.port: "9000"

      traefik.http.routers.webhooks-wan-router.entrypoints: wan
      traefik.http.routers.webhooks-wan-router.middlewares: secure-headers-middleware@file,security-txt-middleware@file
      traefik.http.routers.webhooks-wan-router.rule: Host(`webhooks.bob.house`)
      traefik.http.routers.webhooks-wan-router.service: webhooks-wan-service
      traefik.http.routers.webhooks-wan-router.tls: "true"
      traefik.http.services.webhooks-wan-service.loadbalancer.server.port: "9000"
    networks:
      default: null
      traefik: null
    profiles: [ wan1, ]
    read_only: true
    security_opt: [ no-new-privileges=true, ]
    user: 1000:1000
    volumes: [ "./configs/webhooks.json:/app/webhooks.json:ro", ]
